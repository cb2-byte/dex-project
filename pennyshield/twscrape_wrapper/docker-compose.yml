version: '3.8'

services:
  twscrape:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TWITTER_ACCOUNTS=${TWITTER_ACCOUNTS}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s